# rdfm keybindings  —  user config  (~/.config/rdfm/keybinds.conf)
# ─────────────────────────────────────────────────────────────────────────────
# This file is a personal record of your active keybindings.
# rdfm does NOT parse this file at runtime; bindings are registered via GTK's
# accel map (editable through menus) or compiled into src/main-win.c.
#
# To change a compiled-in bind: edit src/main-win.c and recompile.
# To change a menu accel: use Edit → Keyboard Shortcuts (if enabled) or edit
# ~/.config/rdfm/accels  (GTK accel map, auto-generated).
# ─────────────────────────────────────────────────────────────────────────────

[vim-navigation]
# Compiled into on_view_key_press_event — active when folder view has focus.
# Edit src/main-win.c to change these.

move_down          = j              # GDK_KEY_Down (synth)
move_up            = k              # GDK_KEY_Up   (synth)
go_back            = h              # on_go_back()
go_forward         = l              # on_go_forward()
go_home            = <Shift>H       # on_go_home()   ← most preferred
go_parent          = BackSpace      # on_go_up()

[find-and-location]
# Compiled into on_key_press_event — window-level, always active.

focus_location_bar = /              # grabs path bar; type to filter/navigate
cancel_location    = Escape

[tabs]
next_tab           = <Ctrl>Tab
prev_tab           = <Ctrl><Shift>Tab
switch_to_tab_n    = <Alt>1         # Alt+1…9
new_tab            = t
close_tab          = <Ctrl>w

[navigation]
go_up              = <Alt>Up
go_back_alt        = <Alt>Left
go_forward_alt     = <Alt>Right
go_home_alt        = <Alt>Home
reload             = F5
search             = <Ctrl>f

[view]
size_bigger        = <Ctrl>equal
size_smaller       = <Ctrl>minus
show_hidden        = <Ctrl>h
